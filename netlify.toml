# ==============================================================================
# NETLIFY DEPLOYMENT CONFIGURATION
# Production Routing, Edge Cache Directives, and Security Headers
# ==============================================================================

[build]
  command = "npm run build"
  publish = "dist"

# Single-Page Application (SPA) Client Routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security Headers for All Routes
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://*.supabase.co https://*.fbcdn.net https://*.whatsapp.net; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://graph.facebook.com https://www.google-analytics.com; object-src 'none'; frame-ancestors 'self';"

# Immutable Cache for Vite Content-Hashed Assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache Policy for Service Worker and Manifest
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"
